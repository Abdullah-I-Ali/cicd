name: CI Pipeline

on:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest  # runner raw environment to run the pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Docker image
        run: docker build -t express-hello-world:latest .